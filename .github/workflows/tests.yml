name: Testler

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt sistem kütüphaneleri
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Bağımlılıklar
        run: pip install "PyQt6>=6.4.0" pytest pyflakes
      - name: Lint
        run: python -m pyflakes main.py core ui tests
      - name: Testler
        run: python -m pytest -q
